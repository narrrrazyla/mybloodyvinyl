<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produk | My Bloody Vinyl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Special+Elite&family=Inter:wght@400..700&family=EB+Garamond:ital,wght@0,400..600;1,400..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="in-frame" data-page="product.html">
<main class="page-body">
<div id="detail"></div>
</main>
<script src="products.js"></script>
<script src="cart.js"></script>
<script>
(function () {
    var id = new URLSearchParams(location.search).get('id');
    var p = MBV.get(id), el = document.getElementById('detail');
    if (!p) {
        el.innerHTML = '<div class="empty"><h1>Album tidak ditemukan</h1><p>Tautan ini mungkin salah.</p><a class="btn-vintage" href="catalog.html">Kembali ke katalog</a></div>';
        return;
    }
    document.title = p.title + ' | My Bloody Vinyl';
    var rel = MBV.products.filter(function (x) { return x.genre === p.genre && x.id !== p.id; }).slice(0, 4);
    el.innerHTML = '<p class="crumbs"><a href="catalog.html">Katalog</a> / ' + MBV.esc(p.genre) + '</p>' +
        '<div class="detail">' + MBV.cover(p) +
        '<div class="detail-info"><span class="grade">Kondisi ' + MBV.esc(p.grade) + '</span>' +
        '<h1>' + MBV.esc(p.title) + '</h1><p class="artist">' + MBV.esc(p.artist) + ' · ' + p.year + ' · ' + MBV.esc(p.genre) + '</p>' +
        '<p class="detail-price">' + MBV.rp(p.price) + '</p>' +
        '<p class="detail-desc">' + MBV.esc(p.desc) + '</p>' +
        '<p class="stock" id="stock"></p>' +
        '<div class="buy"><label>Jumlah <input type="number" id="qty" value="1" min="1" max="' + p.stock + '"></label>' +
        '<button type="button" class="btn-vintage" id="add">Tambah ke Keranjang</button>' +
        '<a class="btn-ghost" href="checkout.html" id="now">Beli sekarang</a></div>' +
        '<p class="msg" id="msg" aria-live="polite"></p>' +
        '<a class="src" href="' + p.src + '" target="_blank" rel="noopener">Baca tentang album ini</a></div></div>' +
        (rel.length ? '<h2 class="sub">Album serupa</h2><div class="product-container">' + rel.map(function (x) { return MBV.card(x); }).join('') + '</div>' : '');
    var qty = document.getElementById('qty'), msg = document.getElementById('msg'), add = document.getElementById('add');
    function stock() {
        var left = p.stock - MBV.cart.qtyOf(p.id);
        document.getElementById('stock').textContent = left > 0 ? 'Stok tersisa ' + left : 'Stok di keranjang sudah penuh';
        qty.max = Math.max(1, left); add.disabled = left < 1;
    }
    stock();
    add.addEventListener('click', function () {
        var n = MBV.cart.add(p.id, Math.max(1, parseInt(qty.value, 10) || 1));
        msg.textContent = n ? n + ' item ditambahkan ke keranjang.' : 'Stok sudah penuh.';
        stock();
    });
    document.getElementById('now').addEventListener('click', function () {
        if (!MBV.cart.qtyOf(p.id)) MBV.cart.add(p.id, 1);
    });
})();
</script>
</body></html>

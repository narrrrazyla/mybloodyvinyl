<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keranjang | My Bloody Vinyl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Special+Elite&family=Inter:wght@400..700&family=EB+Garamond:ital,wght@0,400..600;1,400..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="in-frame" data-page="cart.html">
<main class="page-body">
<div class="section-title"><span class="eyebrow">Belanjaanmu</span><h1>Keranjang</h1></div>
<div id="cart"></div>
</main>
<script src="products.js"></script>
<script src="cart.js"></script>
<script>
(function () {
    var el = document.getElementById('cart');
    function render() {
        var lines = MBV.cart.lines();
        if (!lines.length) {
            el.innerHTML = '<div class="empty"><p>Keranjang masih kosong.</p><a class="btn-vintage" href="catalog.html">Lihat katalog</a></div>';
            return;
        }
        el.innerHTML = '<div class="cart-list">' + lines.map(function (l) {
            var p = l.product;
            return '<div class="cart-line">' + MBV.cover(p) +
                '<div><h3><a href="product.html?id=' + p.id + '">' + MBV.esc(p.title) + '</a></h3><p>' + MBV.esc(p.artist) + ' · ' + MBV.rp(p.price) + '</p>' +
                '<button type="button" class="link-btn" data-rm="' + p.id + '">Hapus</button></div>' +
                '<div class="stepper"><button type="button" data-dec="' + p.id + '" aria-label="Kurangi">−</button><output>' + l.qty + '</output><button type="button" data-inc="' + p.id + '" aria-label="Tambah"' + (l.qty >= p.stock ? ' disabled' : '') + '>+</button></div>' +
                '<strong class="line-total">' + MBV.rp(l.total) + '</strong></div>';
        }).join('') + '</div><div class="summary"><p>Subtotal <strong>' + MBV.rp(MBV.cart.subtotal()) + '</strong></p><p class="note">Ongkir dihitung saat checkout.</p><a class="btn-vintage" href="checkout.html">Lanjut ke checkout</a></div>';
    }
    el.addEventListener('click', function (e) {
        var b = e.target.closest('button'); if (!b) return;
        var id = b.getAttribute('data-inc') || b.getAttribute('data-dec') || b.getAttribute('data-rm');
        if (b.hasAttribute('data-inc')) MBV.cart.setQty(id, MBV.cart.qtyOf(id) + 1);
        else if (b.hasAttribute('data-dec')) { if (MBV.cart.qtyOf(id) > 1) MBV.cart.setQty(id, MBV.cart.qtyOf(id) - 1); else MBV.cart.remove(id); }
        else if (b.hasAttribute('data-rm')) MBV.cart.remove(id);
        else return;
        render();
    });
    render();
})();
</script>
</body></html>
